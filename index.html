<!doctype html>
<html lang="de">
  <head>

    <title>Poll App</title>
    <meta http-equiv="refresh" content="0; url=http://127.0.0.1:4200/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #2d2430;
        color: #fff7f0;
        font-family: Segoe UI, sans-serif;
      }

      a {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        text-align: center;
        text-decoration: none;
        color: inherit;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 48px;
        color: #ffc28d;
      }

      p {
        margin: 0 0 24px;
        max-width: 28em;
        line-height: 1.5;
      }

      .btn {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        background: #ffc28d;
        color: #2d2430;
        font-weight: 700;
      }
    </style>
    <script>
      window.location.replace('http://127.0.0.1:4200/');
    </script>
  </head>
  <body>
    <a href="http://127.0.0.1:4200/">
      <div>
        <h1>Poll App</h1>
        <p>Die App öffnet sich unter http://127.0.0.1:4200/</p>
        <span class="btn">App öffnen</span>
        <p>Wenn die Seite nicht lädt, zuerst <strong>Poll-App starten.bat</strong> doppelklicken.</p>
      </div>
    </a>

</html>
