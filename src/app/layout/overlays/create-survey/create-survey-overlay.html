<!--
  Create-survey modal. Shown above the current page instead of being a route,
  so the dashboard stays behind it. The backdrop closes on click, the panel
  stops the event so clicks inside are not treated as "click outside".
-->
<div class="overlay" @overlayAnimation (click)="close()">
  <section
    class="overlay__panel"
    @panelAnimation
    role="dialog"
    aria-modal="true"
    aria-labelledby="create-survey-title"
    (click)="$event.stopPropagation()"
  >
    <header class="overlay__header">
      <div class="overlay__heading">
        <!-- Nothing is stored until Publish, which the badge makes explicit. -->
        <span class="overlay__draft">Draft</span>
        <h1 id="create-survey-title">Create new survey</h1>
      </div>
      <button class="overlay__cancel" type="button" aria-label="Cancel" (click)="close()">
        <span class="overlay__cancel-text">Cancel</span>
        <span aria-hidden="true">✕</span>
      </button>
    </header>

    <!--
      `novalidate` keeps the browser from replacing our own red messages with its
      native bubbles. The `required` and `min` attributes stay in place: they still
      restrict the date picker and drive the `:invalid` styling.
    -->
    <form class="overlay__form" novalidate (submit)="$event.preventDefault(); publish()">
      <!--
        Left column: name, end date and category. Right column: describing
        text. The questions span both columns underneath.
      -->
      <div class="overlay__body">
        <div class="overlay__left">
          <label class="field" [class.field--invalid]="titleError()">
            <span class="field__label">Survey name</span>
            <div class="field__row">
              <input
                type="text"
                [value]="draft().title"
                [attr.aria-invalid]="titleError() ? 'true' : null"
                (input)="patch({ title: inputValue($event) })"
                required
              />
              <button class="trash" type="button" (click)="clearTitle()" aria-label="Clear survey name">
                <app-trash-icon />
              </button>
            </div>
            <span class="field__error" role="alert">{{ titleError() }}</span>
          </label>

          <div class="overlay__pair">
            <label class="field" [class.field--invalid]="endDateError()">
              <span class="field__label">Set end date (optional)</span>
              <div class="field__row">
                <input
                  type="date"
                  [value]="draft().endsAt"
                  [min]="minEndDate"
                  [attr.aria-invalid]="endDateError() ? 'true' : null"
                  [attr.aria-describedby]="endDateError() ? 'end-date-error' : null"
                  (input)="patch({ endsAt: inputValue($event) })"
                />
                <button class="trash" type="button" (click)="clearEndsAt()" aria-label="Clear end date">
                  <app-trash-icon />
                </button>
              </div>
              <!-- Always present: a message must not push the category row down. -->
              <span class="field__error" id="end-date-error" role="alert">{{ endDateError() }}</span>
            </label>

            <!--
              Own dropdown instead of `<select>`, so it can be styled like the
              design. `role="listbox"`/`role="option"` and `aria-expanded`
              restore the semantics the native element would have provided.
            -->
            <div class="field field--category" [class.field--invalid]="categoryError()">
              <span class="field__label">Choose category</span>
              <div class="category-picker">
                <button
                  class="category-picker__trigger"
                  type="button"
                  aria-haspopup="listbox"
                  [attr.aria-expanded]="categoryOpen()"
                  (click)="toggleCategory()"
                >
                  <span>{{ draft().category || 'Select' }}</span>
                  <svg width="12" height="8" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                    <path
                      d="M1 1.5 6 6.5 11 1.5"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                    />
                  </svg>
                </button>

                @if (categoryOpen()) {
                  <ul class="category-picker__menu" role="listbox">
                    @for (category of categories; track category) {
                      <li>
                        <button
                          type="button"
                          role="option"
                          [class.is-active]="draft().category === category"
                          [attr.aria-selected]="draft().category === category"
                          (click)="chooseCategory(category)"
                        >
                          {{ category }}
                        </button>
                      </li>
                    }
                  </ul>
                }
              </div>

              <span class="field__error" role="alert">{{ categoryError() }}</span>
            </div>
          </div>
        </div>

        <div class="overlay__right">
          <div class="field field--description">
            <span class="field__label" id="survey-description-label">Describing text (optional)</span>
            <div class="field__description-input">
              <div class="field__textarea">
                <textarea
                  id="survey-description"
                  aria-labelledby="survey-description-label"
                  [value]="draft().description"
                  (input)="patch({ description: inputValue($event) })"
                ></textarea>
              </div>
              <button
                class="trash"
                type="button"
                (click)="clearDescription()"
                aria-label="Clear describing text"
              >
                <app-trash-icon />
              </button>
            </div>
          </div>
        </div>

        <!--
          Each question is edited by its own component and reports back through
          `questionChange`; the draft itself lives in this overlay. `isFirst`
          decides whether the trash icon clears or removes the question.
        -->
        <div class="overlay__questions">
          @for (question of draft().questions; track question.id; let i = $index; let first = $first) {
            <app-question-editor
              [question]="question"
              [index]="i"
              [isFirst]="first"
              [showErrors]="showErrors()"
              (questionChange)="updateQuestion(i, $event)"
              (removeQuestion)="removeQuestion(i)"
              (clearQuestion)="clearFirstQuestion()"
            />
          }

          <!--
            With a single question the control moves into the free second
            column (`--lead`); from the second question on it sits below them.
          -->
          <button
            class="overlay__add-question"
            [class.overlay__add-question--lead]="draft().questions.length === 1"
            type="button"
            (click)="addQuestion()"
          >
            Add next question
            <span class="overlay__plus" aria-hidden="true">+</span>
          </button>
        </div>
      </div>

      <!-- One line only, so the Publish row keeps its position. -->
      <p class="overlay__errors" role="alert">{{ errorSummary() }}</p>

      <div class="overlay__footer">
        <button class="btn btn--primary btn--confirm overlay__publish" type="submit" [disabled]="submitting()">
          <span>Publish</span>
          <app-primary-btn-icons />
        </button>
      </div>
    </form>
  </section>
</div>
