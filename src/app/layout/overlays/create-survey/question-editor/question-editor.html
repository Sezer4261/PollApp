<!--
  One question inside the create-survey overlay: heading with delete control,
  the question text, and the answer rows with their own delete controls. All
  edits are emitted upwards through `patch()`; the component keeps no state.
-->
<section class="editor">
  <header class="editor__head">
    <span class="field__label">{{ index + 1 }}. Question</span>
    <!--
      Question 1 cannot be removed, only emptied, so the same button changes
      its meaning and its label with `isFirst`.
    -->
    <button
      class="trash"
      type="button"
      (click)="onDeleteQuestion()"
      [attr.aria-label]="isFirst ? 'Clear question' : 'Delete question'"
    >
      <app-trash-icon />
    </button>
  </header>

  <!-- The visible heading already names the field, so the label is for screen readers only. -->
  <label class="field" [class.field--invalid]="textError">
    <span class="sr-only">Question text</span>
    <input
      type="text"
      [value]="question.text"
      [placeholder]="index === 0 ? 'Which date would work best for you?' : 'Question'"
      [attr.aria-invalid]="textError ? 'true' : null"
      (input)="patch({ text: inputValue($event) })"
    />
  </label>

  <!-- Rendered even while empty so revealing a message never moves the block. -->
  <p class="editor__error" role="alert">{{ textError }}</p>

  <div class="editor__answers">
    <div class="editor__answers-head">
      <span class="field__label">Answers</span>
      <!-- Switches the detail page between radio buttons and checkboxes. -->
      <label class="checkbox">
        <input
          type="checkbox"
          [checked]="question.allowMultiple"
          (change)="patch({ allowMultiple: checked($event) })"
        />
        Allow multiple answers
      </label>
    </div>

    <!--
      Letters (A., B., …) come from the pipe, so removing a row renumbers the
      rest automatically. Deleting is only allowed down to two rows; below that
      the component clears the text instead.
    -->
    @for (answer of question.answers; track answer.id; let i = $index) {
      <div class="editor__answer">
        <span class="editor__letter">{{ i | optionLetter }}.</span>
        <input
          type="text"
          [value]="answer.text"
          placeholder="Answer"
          (input)="updateAnswer(answer.id, inputValue($event))"
        />
        <button class="trash" type="button" (click)="removeAnswer(answer.id)" aria-label="Delete answer">
          <app-trash-icon />
        </button>
      </div>
    }

    <p class="editor__error" role="alert">{{ answersError }}</p>

    <!-- Tertiary button from the design: label, circled plus and one rule under both. -->
    <button class="editor__add" type="button" (click)="addAnswer()">
      Add answer
      <span class="editor__plus" aria-hidden="true">+</span>
    </button>
  </div>
</section>
