<header class="site-header" [class.site-header--light]="variant === 'light'">
  <a routerLink="/" class="brand" aria-label="Poll App home">
    <span class="brand__mark" aria-hidden="true">
      <svg width="36" height="32" viewBox="0 0 36 32" fill="none">
        <path d="M4 4.5C4 2.567 5.567 1 7.5 1H22.5C24.433 1 26 2.567 26 4.5V16.5C26 18.433 24.433 20 22.5 20H13L7 26V20H7.5C5.567 20 4 18.433 4 16.5V4.5Z" fill="#F3A36B"/>
        <rect x="9" y="7" width="12" height="2.2" rx="1.1" fill="#24182B"/>
        <rect x="9" y="11.2" width="9" height="2.2" rx="1.1" fill="#24182B"/>
        <rect x="9" y="15.4" width="6" height="2.2" rx="1.1" fill="#24182B"/>
      </svg>
    </span>
    <span class="brand__name">Poll App</span>
  </a>

  @if (showCreate) {
    <button class="btn btn--primary" type="button" (click)="createSurvey.emit()">
      Create survey
    </button>
  }
</header>
