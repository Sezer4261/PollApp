<header class="site-header" [class.site-header--light]="variant === 'light'">
  <a routerLink="/" class="brand" aria-label="Poll App home">
    <span class="brand__mark" aria-hidden="true">
      <svg width="42" height="38" viewBox="0 0 42 38" fill="none">
        <path d="M6 6.2C6 3.4 8.3 1 11.2 1H28.8C31.7 1 34 3.4 34 6.2V20.2C34 23 31.7 25.4 28.8 25.4H18.2L10 35V25.4H11.2C8.3 25.4 6 23 6 20.2V6.2Z" fill="#FFC28D"/>
        <rect x="12" y="8" width="16" height="2.6" rx="1.3" fill="#2D2430"/>
        <rect x="12" y="13.2" width="12" height="2.6" rx="1.3" fill="#2D2430"/>
        <rect x="12" y="18.4" width="8" height="2.6" rx="1.3" fill="#2D2430"/>
      </svg>
    </span>
    <span class="brand__name">
      <span>Poll</span>
      <span>App</span>
    </span>
  </a>

  @if (showCreate) {
    <button class="btn btn--primary" type="button" (click)="createSurvey.emit()">
      Create survey
    </button>
  }
</header>
