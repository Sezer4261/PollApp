<header class="site-header" [class.site-header--light]="variant === 'light'">
  <a routerLink="/" class="brand" aria-label="Poll App home">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 26 18" fill="none">
        <path d="M19.6 12.2h3.4L20.3 18Z" fill="#FFB770" />
        <rect width="26" height="15" rx="3.4" fill="#FFB770" />
        <rect x="3" y="3.1" width="3.9" height="3.7" rx="0.9" fill="#BF8269" />
        <rect x="8.9" y="3.5" width="14.2" height="2.9" rx="1.45" fill="#BF8269" />
        <rect x="3" y="9" width="3.9" height="3.7" rx="0.9" fill="#BF8269" />
        <rect x="8.9" y="9.4" width="14.2" height="2.9" rx="1.45" fill="#BF8269" />
      </svg>
    </span>
    <span class="brand__name">
      <span>Poll</span>
      <span>App</span>
    </span>
  </a>

  @if (showCreate) {
    <button class="btn btn--primary" type="button" (click)="createSurvey.emit()">
      Create survey
    </button>
  }
</header>
