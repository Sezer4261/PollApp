<div class="overlay" @overlayAnimation (click)="close()">
  <section
    class="overlay__panel"
    @panelAnimation
    role="dialog"
    aria-modal="true"
    aria-labelledby="create-survey-title"
    (click)="$event.stopPropagation()"
  >
    <header class="overlay__header">
      <div class="overlay__heading">
        <span class="overlay__draft">Draft</span>
        <h1 id="create-survey-title">Create new survey</h1>
      </div>
      <button class="overlay__cancel" type="button" (click)="close()">
        Cancel
        <span aria-hidden="true">✕</span>
      </button>
    </header>

    <form class="overlay__form" (submit)="$event.preventDefault(); publish()">
      <div class="overlay__body">
        <div class="overlay__left">
          <label class="field">
            <span>Survey name</span>
            <div class="field__row">
              <input
                type="text"
                [value]="draft().title"
                (input)="patch({ title: inputValue($event) })"
                required
              />
              <button class="trash" type="button" (click)="clearTitle()" aria-label="Clear survey name">
                <svg width="16" height="18" viewBox="0 0 14 16" fill="none" aria-hidden="true">
                  <path d="M2.6 16A1.7 1.7 0 0 1 .9 14.2V2.7H0V1.8h4.4V.9h5.2v.9H14v.9h-.9v11.5A1.7 1.7 0 0 1 11.4 16H2.6Zm8.8-13.3H2.6v11.5h8.8V2.7ZM5.2 12.4h.9V4.4h-.9v8Zm2.7 0h.9V4.4h-.9v8Z" fill="#FFC28D"/>
                </svg>
              </button>
            </div>
          </label>

          <div class="overlay__pair">
            <label class="field">
              <span>Set end date (optional)</span>
              <div class="field__row">
                <input
                  type="date"
                  [value]="draft().endsAt"
                  (input)="patch({ endsAt: inputValue($event) })"
                />
                <button class="trash" type="button" (click)="clearEndsAt()" aria-label="Clear end date">
                  <svg width="16" height="18" viewBox="0 0 14 16" fill="none" aria-hidden="true">
                    <path d="M2.6 16A1.7 1.7 0 0 1 .9 14.2V2.7H0V1.8h4.4V.9h5.2v.9H14v.9h-.9v11.5A1.7 1.7 0 0 1 11.4 16H2.6Zm8.8-13.3H2.6v11.5h8.8V2.7ZM5.2 12.4h.9V4.4h-.9v8Zm2.7 0h.9V4.4h-.9v8Z" fill="#FFC28D"/>
                  </svg>
                </button>
              </div>
            </label>

            <label class="field">
              <span>Choose category</span>
              <div class="field__select">
                <select [value]="draft().category" (change)="patch({ category: inputValue($event) })">
                  <option value="" disabled>Choose category</option>
                  @for (category of categories; track category) {
                    <option [value]="category">{{ category }}</option>
                  }
                </select>
              </div>
            </label>
          </div>

          <div class="overlay__questions">
            @for (question of draft().questions; track question.id; let i = $index; let first = $first) {
              <app-question-editor
                [question]="question"
                [index]="i"
                [isFirst]="first"
                (questionChange)="updateQuestion(i, $event)"
                (removeQuestion)="removeQuestion(i)"
                (clearQuestion)="clearFirstQuestion()"
              />
            }
          </div>
        </div>

        <div class="overlay__right">
          <label class="field field--description">
            <span>Describing text (optional)</span>
            <div class="field__textarea">
              <textarea
                [value]="draft().description"
                (input)="patch({ description: inputValue($event) })"
              ></textarea>
              <button
                class="trash trash--overlay"
                type="button"
                (click)="clearDescription()"
                aria-label="Clear describing text"
              >
                <svg width="16" height="18" viewBox="0 0 14 16" fill="none" aria-hidden="true">
                  <path d="M2.6 16A1.7 1.7 0 0 1 .9 14.2V2.7H0V1.8h4.4V.9h5.2v.9H14v.9h-.9v11.5A1.7 1.7 0 0 1 11.4 16H2.6Zm8.8-13.3H2.6v11.5h8.8V2.7ZM5.2 12.4h.9V4.4h-.9v8Zm2.7 0h.9V4.4h-.9v8Z" fill="#FFC28D"/>
                </svg>
              </button>
            </div>
          </label>

          <button class="overlay__add-question" type="button" (click)="addQuestion()">
            Add next question
            <span class="overlay__plus" aria-hidden="true">+</span>
          </button>
        </div>
      </div>

      <div class="overlay__errors">
        @for (error of errors(); track error) {
          <p>{{ error }}</p>
        }
      </div>

      <div class="overlay__footer">
        <button class="overlay__publish" type="submit" [disabled]="submitting()">Publish</button>
      </div>
    </form>
  </section>
</div>
