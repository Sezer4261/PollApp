<section class="editor">
  <header class="editor__head">
    <h3>{{ index + 1 }}. Question</h3>
    <button
      class="trash"
      type="button"
      (click)="onDeleteQuestion()"
      [attr.aria-label]="isFirst ? 'Clear question' : 'Delete question'"
    >
      <svg width="16" height="18" viewBox="0 0 14 16" fill="none" aria-hidden="true">
        <path d="M2.6 16A1.7 1.7 0 0 1 .9 14.2V2.7H0V1.8h4.4V.9h5.2v.9H14v.9h-.9v11.5A1.7 1.7 0 0 1 11.4 16H2.6Zm8.8-13.3H2.6v11.5h8.8V2.7ZM5.2 12.4h.9V4.4h-.9v8Zm2.7 0h.9V4.4h-.9v8Z" fill="#FFC28D"/>
      </svg>
    </button>
  </header>

  <label class="field">
    <span class="sr-only">Question text</span>
    <input
      type="text"
      [value]="question.text"
      [placeholder]="index === 0 ? 'Which date would work best for you?' : 'Question'"
      (input)="patch({ text: inputValue($event) })"
    />
  </label>

  <div class="editor__answers">
    <div class="editor__answers-head">
      <strong>Answers</strong>
      <label class="checkbox">
        <input
          type="checkbox"
          [checked]="question.allowMultiple"
          (change)="patch({ allowMultiple: checked($event) })"
        />
        Allow multiple answers
      </label>
    </div>

    @for (answer of question.answers; track answer.id; let i = $index) {
      <div class="editor__answer">
        <span class="editor__letter">{{ i | optionLetter }}.</span>
        <input
          type="text"
          [value]="answer.text"
          placeholder="Answer"
          (input)="updateAnswer(answer.id, inputValue($event))"
        />
        <button class="trash" type="button" (click)="removeAnswer(answer.id)" aria-label="Delete answer">
          <svg width="16" height="18" viewBox="0 0 14 16" fill="none" aria-hidden="true">
            <path d="M2.6 16A1.7 1.7 0 0 1 .9 14.2V2.7H0V1.8h4.4V.9h5.2v.9H14v.9h-.9v11.5A1.7 1.7 0 0 1 11.4 16H2.6Zm8.8-13.3H2.6v11.5h8.8V2.7ZM5.2 12.4h.9V4.4h-.9v8Zm2.7 0h.9V4.4h-.9v8Z" fill="#FFC28D"/>
          </svg>
        </button>
      </div>
    }

    <button class="editor__add" type="button" (click)="addAnswer()">
      Add answer
      <span class="editor__plus" aria-hidden="true">+</span>
    </button>
  </div>
</section>
