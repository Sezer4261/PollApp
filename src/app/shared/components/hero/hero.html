<section class="hero">
  <div class="hero__copy">
    <h1>Collect Feedback,<br>Unlock Ideas</h1>
    <p>
      Create and share surveys in minutes – from team events to workplace culture.
      Collect opinions, engage your audience, and turn feedback into action.
    </p>
    <button class="btn btn--primary" type="button" (click)="openCreate()">
      New survey
    </button>
  </div>

  <div class="hero__visual" aria-hidden="true">
    <div class="phone">
      <div class="phone__screen">
        <span class="phone__chip">Team activities</span>
        <strong>Next team event</strong>
        <ul>
          <li><span></span> 11.09.2026</li>
          <li class="is-on"><span></span> Bowling night</li>
          <li><span></span> Half a day</li>
        </ul>
        <div class="phone__cta"></div>
      </div>
    </div>
    <span class="float float--bubble">
      <svg width="70" height="56" viewBox="0 0 70 56" fill="none">
        <path d="M8 8c0-4.4 3.6-8 8-8h34c4.4 0 8 3.6 8 8v22c0 4.4-3.6 8-8 8H30L16 54V38c-4.4 0-8-3.6-8-8V8Z" fill="#FFC28D"/>
        <circle cx="26" cy="19" r="3.2" fill="#2D2430"/>
        <circle cx="37" cy="19" r="3.2" fill="#2D2430"/>
        <circle cx="48" cy="19" r="3.2" fill="#2D2430"/>
      </svg>
    </span>
    <span class="float float--check">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="26" fill="#FFC28D"/>
        <path d="M15 27.2 22.2 34.5 38 17" stroke="#2D2430" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="float float--star">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="24" fill="#5a4563"/>
        <path d="M24 9l4.2 9 9.8 1.2-7.2 6.8 2 9.7L24 30.8 15.2 35.7l2-9.7-7.2-6.8 9.8-1.2L24 9Z" fill="#FFC28D"/>
      </svg>
    </span>
    <span class="float float--question">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="24" fill="#E8B86D"/>
        <text x="24" y="32" text-anchor="middle" font-size="26" font-family="Fredoka, sans-serif" fill="#2D2430">?</text>
      </svg>
    </span>
  </div>
</section>
