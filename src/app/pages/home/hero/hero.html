<section class="hero">
  <div class="hero__copy">
    <h1>Collect Feedback,<br>Unlock Ideas</h1>
    <p>
      Create and share surveys in minutes – from team events to workplace culture.
      Collect opinions, engage your audience, and turn feedback into action.
    </p>
    <button class="btn btn--primary" type="button" (click)="openCreate()">
      <span>New survey</span>
      <app-primary-btn-icons />
    </button>
  </div>

  <div class="hero__visual" aria-hidden="true">
    <svg class="hero__layer" viewBox="0 0 124 152" fill="none">
      <defs>
        <filter id="heroBackLift" x="-40%" y="-40%" width="190%" height="190%">
          <feDropShadow dx="1.4" dy="3.4" stdDeviation="2.6" flood-color="#150b19" flood-opacity="0.55" />
        </filter>
      </defs>

      <g class="hero__float hero__float--square" filter="url(#heroBackLift)">
        <rect x="26" y="61" width="8" height="10" rx="2" fill="#56326D" />
      </g>

      <g filter="url(#heroBackLift)">
        <g class="hero__float hero__float--glow">
          <circle cx="105" cy="86.5" r="7" fill="#FBB671" opacity="0.42" />
        </g>
        <g class="hero__float hero__float--check">
          <circle cx="98" cy="108.5" r="13.8" fill="#FBB671" />
          <path
            d="M91.8 109 96.4 113.6 105.1 103.6"
            stroke="#FFFFFF"
            stroke-width="3.1"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
      </g>
    </svg>

    <svg class="hero__layer hero__phone" viewBox="0 0 124 152" fill="none">
      <defs>
        <filter id="heroPhoneLift" x="-30%" y="-25%" width="170%" height="160%">
          <feDropShadow dx="0.5" dy="2.5" stdDeviation="3" flood-color="#100819" flood-opacity="0.42" />
        </filter>
      </defs>

      <g transform="translate(4.854 0.005) scale(0.9247 0.9613)" filter="url(#heroPhoneLift)">
        <rect x="29" y="4" width="75" height="147" rx="11" fill="#D3D7DC" />
        <rect x="33" y="8" width="64" height="139" rx="8" fill="#FFFFFF" />
        <rect x="48" y="23" width="40" height="8" rx="2.2" fill="#E2D7E9" />
        <rect x="49" y="36" width="39" height="4" rx="2" fill="#FBB671" />
        <rect x="49" y="41.5" width="39" height="4" rx="2" fill="#FBB671" />
        <rect x="50" y="58.5" width="5" height="5" rx="1.2" fill="#E2D7E9" />
        <rect x="57" y="58.5" width="28" height="5" rx="2.5" fill="#FBB671" />
        <rect x="50" y="66.5" width="5" height="5" rx="1.2" fill="#E2D7E9" />
        <rect x="57" y="66.5" width="28" height="5" rx="2.5" fill="#FBB671" />
        <rect x="50" y="74" width="5" height="5" rx="1.2" fill="#E2D7E9" />
        <rect x="57" y="74" width="28" height="5" rx="2.5" fill="#FBB671" />
        <circle cx="47" cy="123.5" r="6.5" fill="#35273A" />
        <path
          d="M44.2 123.8 46.3 126.3 50.2 120.7"
          stroke="#FBB671"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <rect x="61" y="122" width="26" height="9" rx="4.5" fill="#FBB671" />
      </g>
    </svg>

    <svg class="hero__layer" viewBox="0 0 124 152" fill="none">
      <defs>
        <filter id="heroFrontLift" x="-40%" y="-40%" width="190%" height="190%">
          <feDropShadow dx="1.4" dy="3.4" stdDeviation="2.6" flood-color="#150b19" flood-opacity="0.55" />
        </filter>
      </defs>

      <g class="hero__float hero__float--star" filter="url(#heroFrontLift)">
        <circle class="hero__spark" cx="24.3" cy="110.3" r="4.4" fill="#503E65" />
        <circle cx="12.5" cy="127" r="13" fill="#443659" />

          fill="#FFCE81"
          stroke="#FFCE81"
          stroke-width="1.35"
          stroke-linejoin="round"
          stroke-linecap="round"
        />
      </g>

      <g class="hero__float hero__float--question-dot" filter="url(#heroFrontLift)">
        <circle cx="118" cy="27.85" r="3.05" fill="#FBB671" />
      </g>

      <g class="hero__float hero__float--chat" filter="url(#heroFrontLift)">
        <g transform="rotate(-7 28.5 47.5)">
          <path d="M33 52h10.5l-2.1 9.2Z" fill="#FBB671" />
          <rect x="11.5" y="38.3" width="34" height="18.4" rx="4.8" fill="#FBB671" />
          <rect x="13.9" y="40.7" width="29.2" height="13.6" rx="2.7" fill="#FFECCD" />
          <circle cx="21.5" cy="47.5" r="1.75" fill="#A792A8" />
          <circle cx="28.5" cy="47.5" r="1.75" fill="#A792A8" />
          <circle cx="35.5" cy="47.5" r="1.75" fill="#A792A8" />
        </g>
      </g>
    </svg>
  </div>
</section>
